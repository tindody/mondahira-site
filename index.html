<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MonDahira</title>
  <style>
    /* Jetons repris tels quels de l'app : constants/colors.ts + constants/theme.ts.
       L'app est en clair uniquement (app.json → userInterfaceStyle: "light"),
       le site ne définit donc aucun thème sombre. */
    :root {
      color-scheme: light;
      --primary: #153706;
      --primary-muted: #F0F2EE;
      --background: #FFFFFF;
      --surface-alt: #F5F5F7;
      --border: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 0 64px; }

    /* hero — calqué sur styles.hero de app/(app)/index.tsx */
    .hero { padding: 24px 24px 48px; }
    .eyebrow {
      font-size: 11px; line-height: 14px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-tertiary);
      margin: 0 0 12px;
    }
    .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 {
      font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px;
      margin: 0; color: var(--text-primary);
    }
    .logo { width: 68px; height: 68px; object-fit: contain; border-radius: 34px; flex: none; }

    /* section + liste groupée — styles.section / styles.list */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -0.2px;
      color: var(--text-primary);
      padding: 0 24px; margin: 0 0 16px;
    }
    .list {
      margin: 0 24px;
      background: var(--surface-alt);
      border-radius: 16px;
      overflow: hidden;
    }
    a.row {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 0.5px solid var(--border);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    a.row:last-child { border-bottom: none; }
    a.row:active { background: rgba(0,0,0,0.03); }

    /* commissionIconBubble : 36×36, r18, fond primaryMuted, icône primary */
    .icon-bubble {
      flex: none;
      width: 36px; height: 36px; border-radius: 18px;
      background: var(--primary-muted);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
      margin-right: 12px;
    }
    .icon-bubble svg { width: 20px; height: 20px; }
    /* typography.body — 17 / 24 / 400 / −0.1 */
    .row-label {
      flex: 1;
      font-size: 17px; line-height: 24px; font-weight: 400; letter-spacing: -0.1px;
      color: var(--text-primary);
    }
    .chevron { flex: none; color: var(--text-tertiary); display: flex; }
    .chevron svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <p class="eyebrow">Dahira Diawartoulah Paris</p>
      <div class="hero-row">
        <h1>MonDahira</h1>
        <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Application</h2>
      <div class="list">
        <a class="row" href="./telecharger.html">
          <span class="icon-bubble">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/>
              <path d="M4.5 16.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-1.5"/>
            </svg>
          </span>
          <span class="row-label">Télécharger l'application</span>
          <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Informations</h2>
      <div class="list">
        <a class="row" href="./support.html">
          <span class="icon-bubble">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M6.2 6.2 8.9 8.9M17.8 6.2l-2.7 2.7M6.2 17.8l2.7-2.7M17.8 17.8l-2.7-2.7"/>
            </svg>
          </span>
          <span class="row-label">Support &amp; aide</span>
          <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
        <a class="row" href="./confidentialite.html">
          <span class="icon-bubble">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.5 5 6v6c0 4.6 3.1 7.6 7 8.5 3.9-.9 7-3.9 7-8.5V6l-7-2.5Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </span>
          <span class="row-label">Politique de confidentialité</span>
          <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
