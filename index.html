<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MonDahira</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1c1c1e;
      background: #fff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
    .sub { color: #8e8e93; margin: 0 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card {
      display: block;
      padding: 16px 18px;
      border-radius: 14px;
      background: #f2f2f7;
      color: #0a7ea4;
      text-decoration: none;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e5e5ea; background: #000; }
      .sub { color: #98989f; }
      a.card { background: #1c1c1e; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="./assets/logo.png" alt="Logo Dahira Diawartoulah" style="width:96px;height:96px;object-fit:contain;margin:0 auto 16px;display:block;" />
    <h1>MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>
    <div class="links">
      <a class="card" href="./telecharger.html">Télécharger l'application</a>
      <a class="card" href="./support.html">Support &amp; aide</a>
      <a class="card" href="./confidentialite.html">Politique de confidentialité</a>
    </div>
  </div>
</body>
</html>
