<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MonDahira</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #153706;
      --accent: #DEA002;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-disabled: #B9B9BE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background:
        radial-gradient(ellipse 60% 45% at 22% 12%, rgba(222,160,2,0.30), transparent 65%),
        radial-gradient(ellipse 55% 42% at 82% 30%, rgba(233,184,51,0.24), transparent 65%),
        radial-gradient(ellipse 65% 50% at 46% 82%, rgba(201,138,2,0.20), transparent 65%),
        radial-gradient(ellipse 50% 40% at 70% 95%, rgba(243,208,122,0.22), transparent 65%),
        #FFFFFF;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    .logo { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 16px; display: block; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--primary); }
    .sub { color: var(--text-secondary); margin: 0 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 17px 20px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: none;
      box-shadow: 0 6px 16px rgba(21, 55, 6, 0.22);
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    a.card svg { display: block; width: 20px; height: 20px; flex: none; }
    a.card span { display: block; line-height: 1; }
    a.card:active { opacity: 0.85; transform: scale(0.98); }
    a.card.accent {
      background: var(--accent);
      color: #3A2900;
      box-shadow: 0 6px 16px rgba(222, 160, 2, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #E5E5EA;
        background:
          radial-gradient(ellipse 60% 45% at 22% 12%, rgba(222,160,2,0.16), transparent 65%),
          radial-gradient(ellipse 55% 42% at 82% 30%, rgba(233,184,51,0.13), transparent 65%),
          radial-gradient(ellipse 65% 50% at 46% 82%, rgba(201,138,2,0.12), transparent 65%),
          radial-gradient(ellipse 50% 40% at 70% 95%, rgba(243,208,122,0.10), transparent 65%),
          #000000;
      }
      h1 { color: var(--accent); }
      .sub { color: #98989F; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
    <h1>MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>
    <div class="links">
      <a class="card" href="./telecharger.html">
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M296 384h-80c-13.3 0-24-10.7-24-24V192h-87.7c-17.8 0-26.7-21.5-14.1-34.1L242.3 5.7c7.5-7.5 19.8-7.5 27.3 0l152.2 152.2c12.6 12.6 3.7 34.1-14.1 34.1H320v168c0 13.3-10.7 24-24 24zM0 424v40c0 13.3 10.7 24 24 24h464c13.3 0 24-10.7 24-24v-40c0-13.3-10.7-24-24-24H341.5l-27.8 27.8c-15.6 15.6-42.6 16-58.6 0L227.5 400H24c-13.3 0-24 10.7-24 24zm400 24c-13.3 0-24-10.7-24-24s10.7-24 24-24 24 10.7 24 24-10.7 24-24 24z"/></svg>
        <span>Télécharger l'application</span>
      </a>
      <a class="card accent" href="./support.html">
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm0 448c-110.5 0-200-89.5-200-200S145.5 56 256 56s200 89.5 200 200-89.5 200-200 200zm107.2-322.9c-11.2-9.6-27.2-9.6-38.4 0L200 227.1V184c0-13.3-10.7-24-24-24s-24 10.7-24 24v88c0 13.3 10.7 24 24 24h88c13.3 0 24-10.7 24-24s-10.7-24-24-24h-43.1l124.8-104.9c11.2-9.6 11.2-27.1 0-36.7-1.2-1-2.4-1.8-3.5-2.4z" opacity="0"/><path d="M256.02 336c-16.57 0-30 13.43-30 30s13.43 30 30 30 30-13.43 30-30-13.43-30-30-30zM256 88c-59.65 0-108 48.35-108 108 0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8 0-33.13 26.87-60 60-60s60 26.87 60 60c0 25.35-13.9 40.85-35.3 55.5-24.1 16.5-52.7 37.3-52.7 84.5v4c0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8v-2.5c0-30.5 11.6-40.6 32.9-55.3C315.6 265.5 348 240.4 348 196c0-59.65-48.35-108-108-108z"/></svg>
        <span>Support &amp; aide</span>
      </a>
      <a class="card accent" href="./confidentialite.html">
        <svg viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M400 224h-24v-72C376 68.2 307.8 0 224 0S72 68.2 72 152v72H48c-26.5 0-48 21.5-48 48v192c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V272c0-26.5-21.5-48-48-48zM224 384c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48zm97.6-160H126.4v-72c0-53.9 43.7-97.6 97.6-97.6s97.6 43.7 97.6 97.6v72z"/></svg>
        <span>Politique de confidentialité</span>
      </a>
    </div>
  </div>
</body>
</html>
