<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MonDahira</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #153706;
      --primary-muted: #F0F2EE;
      --accent: #DEA002;
      --accent-muted: #FAF3DC;
      --surface-alt: #F5F5F7;
      --border: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --text-disabled: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background: #fff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    .logo { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 16px; display: block; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--primary); }
    .sub { color: var(--text-secondary); margin: 0 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card {
      display: block;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--primary-muted);
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    a.card.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    @media (prefers-color-scheme: dark) {
      body { color: #E5E5EA; background: #000; }
      h1 { color: var(--accent); }
      .sub { color: #98989F; }
      a.card:not(.primary) { background: #1C1C1E; color: #E5E5EA; border-color: #2C2C2E; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
    <h1>MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>
    <div class="links">
      <a class="card primary" href="./telecharger.html">Télécharger l'application</a>
      <a class="card" href="./support.html">Support &amp; aide</a>
      <a class="card" href="./confidentialite.html">Politique de confidentialité</a>
    </div>
  </div>
</body>
</html>
