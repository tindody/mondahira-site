<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Télécharger MonDahira</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #153706;
      --primary-dark: #0F2804;
      --accent: #DEA002;
      --border: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --text-disabled: #B9B9BE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background:
        radial-gradient(ellipse 60% 45% at 22% 12%, rgba(222,160,2,0.30), transparent 65%),
        radial-gradient(ellipse 55% 42% at 82% 30%, rgba(233,184,51,0.24), transparent 65%),
        radial-gradient(ellipse 65% 50% at 46% 82%, rgba(201,138,2,0.20), transparent 65%),
        radial-gradient(ellipse 50% 40% at 70% 95%, rgba(243,208,122,0.22), transparent 65%),
        #FFFFFF;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    .logo { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 16px; display: block; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--primary); }
    .sub { color: var(--text-secondary); margin: 0 0 32px; }

    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card,
    button.card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 20px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      font-family: inherit;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease, transform 0.1s ease;
      box-shadow: 0 6px 16px rgba(21, 55, 6, 0.22);
    }
    a.card svg, button.card svg { display: block; width: 20px; height: 20px; flex: none; }
    a.card span, button.card span { display: block; line-height: 1; }
    a.card:active { opacity: 0.85; transform: scale(0.98); }

    a.card.accent {
      background: var(--accent);
      color: #3A2900;
      box-shadow: 0 6px 16px rgba(222, 160, 2, 0.25);
    }
    button.card[disabled] {
      background: #EDEDEF;
      color: var(--text-disabled);
      box-shadow: none;
      cursor: not-allowed;
    }

    .note {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      margin-top: 6px;
    }
    a.back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 32px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-decoration: none;
    }
    a.back svg { width: 15px; height: 15px; }

    @media (prefers-color-scheme: dark) {
      body {
        color: #E5E5EA;
        background:
          radial-gradient(ellipse 60% 45% at 22% 12%, rgba(222,160,2,0.16), transparent 65%),
          radial-gradient(ellipse 55% 42% at 82% 30%, rgba(233,184,51,0.13), transparent 65%),
          radial-gradient(ellipse 65% 50% at 46% 82%, rgba(201,138,2,0.12), transparent 65%),
          radial-gradient(ellipse 50% 40% at 70% 95%, rgba(243,208,122,0.10), transparent 65%),
          #000000;
      }
      h1 { color: var(--accent); }
      .sub, .note, a.back { color: #98989F; }
      button.card[disabled] { background: #1C1C1E; color: #636366; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
    <h1>Télécharger MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>

    <div class="links" id="links">
      <!-- rempli par JS selon la plateforme détectée -->
    </div>

    <a class="back" href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
      Retour
    </a>
  </div>

  <script>
    function detectPlatform() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    var APPLE_SVG = '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.6c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';
    var ANDROID_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="8" width="12" height="12" rx="2.5"/><path d="M9 4.5 10.5 7M15 4.5 13.5 7M9.5 12v2M14.5 12v2M3.5 11v4M20.5 11v4"/></svg>';

    var IOS_URL = "https://apps.apple.com/us/app/mon-dahira/id6779175128";
    var links = document.getElementById("links");
    var platform = detectPlatform();

    var html = "";

    if (platform === "ios") {
      html += '<a class="card" href="' + IOS_URL + '">' + APPLE_SVG + '<span>Télécharger sur l\'App Store</span></a>';
      html += '<button class="card" disabled>' + ANDROID_SVG + '<span>Bientôt disponible sur Android</span></button>';
    } else if (platform === "android") {
      html += '<button class="card" disabled>' + ANDROID_SVG + '<span>Bientôt disponible sur Android</span></button>';
      html += '<p class="note">L\'application est en cours de validation sur le Play Store.</p>';
      html += '<a class="card accent" href="' + IOS_URL + '">' + APPLE_SVG + '<span>Voir sur l\'App Store (iOS)</span></a>';
    } else {
      html += '<a class="card" href="' + IOS_URL + '">' + APPLE_SVG + '<span>Télécharger sur l\'App Store (iOS)</span></a>';
      html += '<button class="card" disabled>' + ANDROID_SVG + '<span>Bientôt disponible sur Android</span></button>';
    }

    links.innerHTML = html;
  </script>
</body>
</html>
