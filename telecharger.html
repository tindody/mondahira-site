<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Télécharger MonDahira</title>
  <style>
    /* Jetons repris tels quels de l'app : constants/colors.ts + constants/theme.ts.
       L'app est en clair uniquement (app.json → userInterfaceStyle: "light"). */
    :root {
      color-scheme: light;
      --primary: #153706;
      --primary-muted: #F0F2EE;
      --background: #FFFFFF;
      --surface-alt: #F5F5F7;
      --border: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --text-disabled: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 0 64px; }

    .hero { padding: 24px 24px 48px; }
    .eyebrow {
      font-size: 11px; line-height: 14px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-tertiary); margin: 0 0 12px;
    }
    .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
    .logo { width: 68px; height: 68px; object-fit: contain; flex: none; }

    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -0.2px;
      padding: 0 24px; margin: 0 0 16px;
    }
    .list { margin: 0 24px; background: var(--surface-alt); border-radius: 16px; overflow: hidden; }

    a.row, .row-disabled {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 16px;
      border: none;
      border-bottom: 0.5px solid var(--border);
      background: none;
      font: inherit;
      text-align: left;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    a.row:last-child, .row-disabled:last-child { border-bottom: none; }
    a.row:active { background: rgba(0,0,0,0.03); }

    .icon-bubble {
      flex: none;
      width: 36px; height: 36px; border-radius: 18px;
      background: var(--primary-muted);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
      margin-right: 12px;
    }
    .icon-bubble svg { width: 20px; height: 20px; }
    /* typography.body — 17 / 24 / 400 / −0.1 */
    .row-label { flex: 1; font-size: 17px; line-height: 24px; font-weight: 400; letter-spacing: -0.1px; }
    .chevron { flex: none; color: var(--text-tertiary); display: flex; }
    .chevron svg { width: 16px; height: 16px; }

    .row-disabled .icon-bubble { background: #EAEAEC; color: var(--text-disabled); }
    .row-disabled .row-label { color: var(--text-disabled); }

    /* typography.footnote — 13 / 18 / 400 */
    .note { font-size: 13px; line-height: 18px; color: var(--text-tertiary); margin: 12px 24px 0; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 8px 24px 0;
      font-size: 15px; line-height: 20px; font-weight: 500;
      color: var(--primary); text-decoration: none;
    }
    .back svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <p class="eyebrow">Dahira Diawartoulah Paris</p>
      <div class="hero-row">
        <h1>Télécharger</h1>
        <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Obtenir l'application</h2>
      <div class="list" id="links"><!-- rempli selon la plateforme détectée --></div>
      <p class="note" id="note" hidden>L'application est en cours de validation sur le Play Store.</p>
    </div>

    <a class="back" href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
      Retour
    </a>
  </div>

  <script>
    function detectPlatform() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    // Marques déposées : tracés pleins. Les icônes d'interface restent en trait.
    var APPLE_SVG = '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.6c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';
    var ANDROID_SVG = '<svg viewBox="0 0 576 512" fill="currentColor" aria-hidden="true"><path d="M420.55 301.93a24 24 0 1 1 24-24 24 24 0 0 1-24 24m-265.1 0a24 24 0 1 1 24-24 24 24 0 0 1-24 24m273.7-144.48 47.94-83a10 10 0 1 0-17.27-10l-48.54 84.07a301.25 301.25 0 0 0-246.56 0L116.18 64.45a10 10 0 1 0-17.27 10l47.94 83C64.53 202.22 8.24 285.55 0 384h576c-8.24-98.45-64.54-181.78-146.85-226.55"/></svg>';
    var CHEVRON = '<span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>';

    var IOS_URL = "https://apps.apple.com/us/app/mon-dahira/id6779175128";

    var appleRow =
      '<a class="row" href="' + IOS_URL + '">' +
      '<span class="icon-bubble">' + APPLE_SVG + '</span>' +
      '<span class="row-label">Télécharger sur l\'App Store</span>' + CHEVRON + '</a>';

    var androidRow =
      '<div class="row-disabled">' +
      '<span class="icon-bubble">' + ANDROID_SVG + '</span>' +
      '<span class="row-label">Bientôt disponible sur Android</span></div>';

    var platform = detectPlatform();
    var links = document.getElementById("links");

    if (platform === "android") {
      links.innerHTML = androidRow + appleRow;
      document.getElementById("note").hidden = false;
    } else {
      links.innerHTML = appleRow + androidRow;
    }
  </script>
</body>
</html>
