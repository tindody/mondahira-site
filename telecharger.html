<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Télécharger MonDahira</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #153706;
      --primary-muted: #F0F2EE;
      --accent: #DEA002;
      --accent-muted: #FAF3DC;
      --surface-alt: #F5F5F7;
      --border: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --text-disabled: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background: #fff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    .logo { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 16px; display: block; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--primary); }
    .sub { color: var(--text-secondary); margin: 0 0 32px; }

    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card,
    button.card {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--primary-muted);
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }
    a.card:active { opacity: 0.7; }

    a.card.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    a.card.accent {
      background: var(--accent-muted);
      color: #7A5900;
      border-color: var(--border);
    }
    button.card[disabled] {
      background: var(--surface-alt);
      color: var(--text-disabled);
      border-color: var(--border);
      cursor: not-allowed;
    }

    .note {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      margin-top: 6px;
    }
    a.back {
      display: inline-block;
      margin-top: 32px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #E5E5EA; background: #000; }
      h1 { color: var(--accent); }
      .sub, .note, a.back { color: #98989F; }
      a.card:not(.primary):not(.accent) { background: #1C1C1E; color: #E5E5EA; border-color: #2C2C2E; }
      a.card.accent { background: #2A230D; color: var(--accent); border-color: #3A2F14; }
      button.card[disabled] { background: #1C1C1E; color: #636366; border-color: #2C2C2E; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" alt="Logo Dahira Diawartoulah" />
    <h1>Télécharger MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>

    <div class="links" id="links">
      <!-- rempli par JS selon la plateforme détectée -->
    </div>

    <a class="back" href="./index.html">&larr; Retour</a>
  </div>

  <script>
    function detectPlatform() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    var IOS_URL = "https://apps.apple.com/us/app/mon-dahira/id6779175128";
    var links = document.getElementById("links");
    var platform = detectPlatform();

    var html = "";

    if (platform === "ios") {
      html += '<a class="card primary" href="' + IOS_URL + '">Télécharger sur l\'App Store</a>';
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
    } else if (platform === "android") {
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
      html += '<p class="note">L\'application est en cours de validation sur le Play Store.</p>';
      html += '<a class="card accent" href="' + IOS_URL + '">Voir sur l\'App Store (iOS)</a>';
    } else {
      html += '<a class="card primary" href="' + IOS_URL + '">Télécharger sur l\'App Store (iOS)</a>';
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
    }

    links.innerHTML = html;
  </script>
</body>
</html>
