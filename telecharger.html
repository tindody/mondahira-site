<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Télécharger MonDahira</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1c1c1e;
      background: #fff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
    .sub { color: #8e8e93; margin: 0 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card, button.card {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      background: #f2f2f7;
      color: #0a7ea4;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }
    a.card.primary {
      background: #0a7ea4;
      color: #fff;
    }
    button.card[disabled] {
      color: #8e8e93;
      cursor: not-allowed;
    }
    .note {
      font-size: 0.85rem;
      color: #8e8e93;
      margin-top: 6px;
    }
    a.back {
      display: inline-block;
      margin-top: 32px;
      color: #8e8e93;
      font-size: 0.9rem;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e5e5ea; background: #000; }
      .sub, .note, a.back { color: #98989f; }
      a.card:not(.primary) { background: #1c1c1e; }
      button.card[disabled] { background: #1c1c1e; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Télécharger MonDahira</h1>
    <p class="sub">Application du Dahira Diawartoulah (Paris)</p>
    <div class="links" id="links">
      <!-- rempli par JS selon la plateforme détectée -->
    </div>
    <a class="back" href="./index.html">&larr; Retour</a>
  </div>

  <script>
    function detectPlatform() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    var IOS_URL = "https://apps.apple.com/us/app/mon-dahira/id6779175128";
    var links = document.getElementById("links");
    var platform = detectPlatform();

    var html = "";

    if (platform === "ios") {
      html += '<a class="card primary" href="' + IOS_URL + '">Télécharger sur l\'App Store</a>';
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
    } else if (platform === "android") {
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
      html += '<p class="note">L\'application est en cours de validation sur le Play Store.</p>';
      html += '<a class="card" href="' + IOS_URL + '">Voir sur l\'App Store (iOS)</a>';
    } else {
      html += '<a class="card primary" href="' + IOS_URL + '">Télécharger sur l\'App Store (iOS)</a>';
      html += '<button class="card" disabled>Bientôt disponible sur Android</button>';
    }

    links.innerHTML = html;
  </script>
</body>
</html>
